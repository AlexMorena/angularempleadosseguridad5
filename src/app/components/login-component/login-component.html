<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-md border border-slate-800 p-8 rounded-2xl shadow-xl shadow-slate-950/50">
    
    <!-- Título -->
    <div class="text-center mb-8">
      <div class="w-12 h-12 mx-auto mb-4 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Inicia sesión</h1>
      <p class="text-sm text-slate-400 mt-1">Introduce tus credenciales para continuar</p>
    </div>

    <!-- Formulario -->
    <form #formLogin="ngForm" class="space-y-5">
      
      <!-- Campo Usuario -->
      <div class="space-y-1.5">
        <label class="block text-sm font-medium text-slate-300">Usuario</label>
        <input 
          type="text" 
          name="cajausuario" 
          #cajausuario
          placeholder="Tu nombre de usuario"
          class="w-full px-4 py-2.5 bg-slate-800/60 border border-slate-700/60 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all"
        />
      </div>

      <!-- Campo Password -->
      <div class="space-y-1.5">
        <label class="block text-sm font-medium text-slate-300">Password</label>
        <input 
          type="password" 
          name="cajapassword" 
          #cajapassword
          placeholder="••••••••"
          class="w-full px-4 py-2.5 bg-slate-800/60 border border-slate-700/60 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500 transition-all"
        />
      </div>

      <!-- Botón Enviar -->
      <button 
        type="button" 
        (click)="login()"
        class="w-full mt-2 py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm rounded-xl shadow-lg shadow-indigo-600/30 hover:shadow-indigo-600/50 transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500/40 cursor-pointer"
      >
        Enviar
      </button>

    </form>
  </div>
</div>
