<nav class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo y Enlaces Principales -->
      <div class="flex items-center space-x-8">
        <!-- Logo -->
        <a href="#" class="flex items-center space-x-3 group">
          <div
            class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20 group-hover:scale-105 transition-transform"
          >
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 10V3L4 14h7v7l9-11h-7z"
              />
            </svg>
          </div>
          <span
            class="text-white font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent"
          >
            App<span class="text-indigo-400">Pro</span>
          </span>
        </a>

        <!-- Enlaces de navegación (Desktop) -->
        <div class="hidden md:flex items-center space-x-1">
          <a
            [routerLink]="['/home']"
            class="px-3 py-2 rounded-lg bg-slate-800 text-white font-medium text-sm transition-all"
            >Home</a
          >
          <a
            [routerLink]="['/perfil']"
            class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all text-sm"
            >Perfil</a
          >
          <a
            [routerLink]="['subordinados']"
            class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all text-sm"
            >Subordinados</a
          >
          <a
            [routerLink]="['/imagenes']"
            class="px-3 py-2 rounded-lg text-slate-300 hover:text-white hover:bg-slate-800/60 transition-all text-sm"
            >Imagenes</a
          >
        </div>
      </div>

      <!-- Acciones de la Derecha (Notificaciones, Perfil y Cerrar Sesión) -->
      <div class="hidden md:flex items-center space-x-4">
        <!-- Botón de Notificaciones -->
        <button
          class="relative p-2 text-slate-400 hover:text-white hover:bg-slate-800/60 rounded-full transition-colors focus:outline-none"
        >
          <span
            class="absolute top-1.5 right-1.5 w-2 h-2 bg-indigo-500 rounded-full animate-pulse"
          ></span>
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
            />
          </svg>
        </button>

        <!-- Avatar / Perfil Condicional -->
        <div
          class="flex items-center space-x-3 p-1.5 rounded-xl hover:bg-slate-800/65 transition-colors cursor-pointer"
        >
          @if(usuario(); as dato) {
            <!-- Si hay usuario activo: muestra la imagen y el apellido -->
            <img
              class="w-8 h-8 rounded-lg object-cover ring-2 ring-indigo-500/30"
              src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces"
              alt="Avatar de usuario"
            />
            <div class="hidden lg:block text-left">
              <span class="block text-sm font-medium text-slate-200 leading-none">{{dato.apellido}}</span>
              <span class="block text-xs text-slate-400 mt-1">Admin</span>
            </div>
          } @else {
            <!-- Si no hay usuario activo: oculta la imagen y muestra "Sin login" en rojo -->
            <div class="hidden lg:block text-left px-1">
              <span class="block text-sm font-bold text-red-500 leading-none">Sin login</span>
            </div>
          }

          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </div>

        <!-- Botón de Cerrar Sesión -->
        <button
          (click)="cerrarSesion()"
          class="flex items-center space-x-2 px-3 py-2 rounded-xl text-red-400 hover:text-red-300 hover:bg-red-500/10 transition-all text-sm font-medium border border-red-500/20 cursor-pointer"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
            />
          </svg>
          <span class="hidden lg:inline">Salir</span>
        </button>

        <!-- Botón de Iniciar Sesión -->
        <a
          [routerLink]="['/login']"
          class="flex items-center space-x-2 px-3 py-2 rounded-xl text-indigo-400 hover:text-indigo-300 hover:bg-indigo-500/10 transition-all text-sm font-medium border border-indigo-500/20"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"
            />
          </svg>
          <span class="hidden lg:inline">Iniciar</span>
        </a>
      </div>

      <!-- Botón Menú Hamburguesa (Móvil) -->
      <div class="md:hidden flex items-center">
        <button
          class="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/60 focus:outline-none"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
        </button>
      </div>
    </div>
  </div>
</nav>
