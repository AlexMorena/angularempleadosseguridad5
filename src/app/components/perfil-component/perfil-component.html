<div class="min-h-[80vh] flex items-center justify-center px-4 py-8">
  <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-md border border-slate-800 p-8 rounded-3xl shadow-xl shadow-slate-950/50">
    
    @if (perfil) {
      <!-- Cabecera de la Tarjeta con Icono y Título -->
      <div class="text-center pb-6 mb-6 border-b border-slate-800">
        <div class="w-14 h-14 mx-auto mb-3 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Perfil</h1>
        <p class="text-xs text-slate-400 mt-1">Información detallada del empleado</p>
      </div>

      <!-- Lista de Datos del Empleado -->
      <div class="space-y-4">
        
        <div class="flex items-center justify-between p-3.5 bg-slate-800/40 rounded-xl border border-slate-700/40">
          <span class="text-sm text-slate-400 font-medium">ID Empleado</span>
          <span class="text-sm text-white font-semibold">{{ perfil.idEmpleado }}</span>
        </div>

        <div class="flex items-center justify-between p-3.5 bg-slate-800/40 rounded-xl border border-slate-700/40">
          <span class="text-sm text-slate-400 font-medium">Apellido</span>
          <span class="text-sm text-white font-semibold">{{ perfil.apellido }}</span>
        </div>

        <div class="flex items-center justify-between p-3.5 bg-slate-800/40 rounded-xl border border-slate-700/40">
          <span class="text-sm text-slate-400 font-medium">Oficio</span>
          <span class="px-2.5 py-1 text-xs font-medium text-indigo-300 bg-indigo-500/10 border border-indigo-500/20 rounded-lg">
            {{ perfil.oficio }}
          </span>
        </div>

        <div class="flex items-center justify-between p-3.5 bg-slate-800/40 rounded-xl border border-slate-700/40">
          <span class="text-sm text-slate-400 font-medium">Salario</span>
          <span class="text-sm text-emerald-400 font-bold">{{ perfil.salario }}</span>
        </div>

        <div class="flex items-center justify-between p-3.5 bg-slate-800/40 rounded-xl border border-slate-700/40">
          <span class="text-sm text-slate-400 font-medium">Director</span>
          <span class="text-sm text-slate-200 font-semibold">{{ perfil.director }}</span>
        </div>

      </div>

    } @else {
      <!-- Estado de Carga -->
      <div class="text-center py-12 space-y-4">
        <div class="w-10 h-10 mx-auto border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-sm text-slate-400 font-medium tracking-wide">Cargando...</p>
      </div>
    }

  </div>
</div>
